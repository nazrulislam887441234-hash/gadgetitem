<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Gadget Item</title>
    <meta name="description" content="Secure admin and owner login for Gadget Item.">
    <link rel="canonical" href="https://store.ghotimarket.com/admin-login.html">
    
    <!-- Open Graph Metadata -->
    <meta property="og:title" content="Admin Login | Gadget Item">
    <meta property="og:description" content="Secure admin and owner login for Gadget Item.">
    <meta property="og:image" content="https://ghotimarket.com/amrweb/banner1.png">
    <meta property="og:type" content="website">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://store.ghotimarket.com/amrweb/website-logo.png">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <main class="login-wrapper">
        <div class="login-card">
            <!-- Top Branding -->
            <div class="brand-container">
                <img src="https://store.ghotimarket.com/amrweb/website-logo.png" alt="Gadget Item Logo" class="brand-logo">
                <h1 class="brand-title">Gadget Item</h1>
                <p class="brand-subtitle">Admin &amp; Owner Login</p>
            </div>

            <!-- Error / Notification Box -->
            <div id="alertBox" class="alert-box hidden" role="alert">
                <span id="alertIcon" class="alert-icon"></span>
                <span id="alertMessage" class="alert-message"></span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form" novalidate>
                <!-- Email Input Group -->
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div class="input-field-wrapper">
                        <span class="input-icon">
                            <!-- SVG Email Icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                        </span>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
                    </div>
                </div>

                <!-- Password Input Group -->
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-field-wrapper">
                        <span class="input-icon">
                            <!-- SVG Lock Icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        </span>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" id="togglePassword" class="password-toggle" aria-label="Toggle password visibility">
                            <!-- SVG Eye Icon (Show) -->
                            <svg id="eyeShowIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <!-- SVG Eye Off Icon (Hide) -->
                            <svg id="eyeHideIcon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="submit-btn">
                    <span id="btnText">Login to Dashboard</span>
                    <span id="btnLoader" class="hidden">
                        <!-- SVG Loading Spinner -->
                        <svg class="spinner" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>
                        Signing in...
                    </span>
                    <span id="btnIcon" class="btn-icon">
                        <!-- SVG Arrow Right Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </span>
                </button>
            </form>
        </div>
    </main>

    <!-- Main JS Module -->
    <script type="module" src="login.js"></script>
</body>
</html>
